<!-- Tailwind CSS CDN with custom brand tokens -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gold:          '#D4AF37',
          'gold-light':  '#F0D060',

          velvet:        '#1A1A2E',
          surface:       '#16213E',
          'alch-green':  '#2E5339',
          'alch-blue':   '#4DA6FF',
          'alch-orange': '#E8743B',

        },

<style>
/* ═══════════════════════════════════════════════════════════════
   THE ALCHEMIST'S PATH — GLOBAL LUXURY DESIGN SYSTEM
   ═══════════════════════════════════════════════════════════════ */

/* ── Brand Design Tokens ── */
:root {
  --gold:        #D4AF37;
  --gold-light:  #F0D060;
  --gold-dim:    #8B6914;
  --charcoal:    #0D0D0D;
  --velvet:      #1A1A2E;
  --surface:     #16213E;
  --surface-2:   #1E2A45;
  --text-main:   #E8E4D8;
  --text-muted:  #9A9080;
  --green:       #2E5339;
  --blue:        #4DA6FF;
  --orange:      #E8743B;
  --teal:        #3BBFBF;
  --radius-card: 12px;
  --border-gold: 1px solid rgba(212, 175, 55, 0.28);
}

/* ── Page foundation overrides (targets System.io wrappers) ── */
body,
.sib-page-wrapper,
.page-wrapper,
[class*="cf-page"],
[class*="sib-section"] {
  background-color: var(--charcoal) !important;
  color: var(--text-main) !important;
}

/* ── Typography ── */
body, p, li, span, td, label {
  font-family: 'Inter', system-ui, sans-serif !important;
  color: var(--text-main);
}

h1, h2, h3, h4, h5, h6,
[class*="title"], .headline, .heading {
  font-family: 'Spectral', Georgia, serif !important;
  color: var(--gold) !important;
  letter-spacing: 0.025em;
  line-height: 1.2;
}

a { color: var(--gold); transition: opacity 0.2s; }
a:hover { opacity: 0.8; }

/* ── Keyframe Animations ── */
@keyframes goldPulse {
  0%, 100% {
    box-shadow: 0 0 8px rgba(212,175,55,0.2),
                0 0 20px rgba(212,175,55,0.05);
  }
  50% {
    box-shadow: 0 0 24px rgba(212,175,55,0.55),
                0 0 60px rgba(212,175,55,0.15);
  }
}

@keyframes shimmerGold {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0);    }
}

@keyframes alchemyReveal {
  0%   { filter: grayscale(1) brightness(0.35); opacity: 0.2; transform: scale(0.96) translateX(-6px); }
  55%  { filter: grayscale(0) brightness(1.4);               transform: scale(1.03) translateX(0);    }
  100% { filter: grayscale(0) brightness(1);  opacity: 1;    transform: scale(1)    translateX(0);    }
}

/* ── Reusable Luxury Card ── */
.alch-card {
  background: linear-gradient(145deg, var(--velvet) 0%, var(--surface) 100%);
  border: var(--border-gold);
  border-radius: var(--radius-card);
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.alch-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
  opacity: 0.45;
}
.alch-card:hover {
  border-color: rgba(212, 175, 55, 0.6);
  box-shadow: 0 0 35px rgba(212, 175, 55, 0.12);
}

/* ── Gold CTA Button ── */
.alch-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background: linear-gradient(135deg, #D4AF37 0%, #8B6914 50%, #D4AF37 100%);
  background-size: 200% auto;
  color: #0D0D0D !important;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  padding: 0.9rem 2.5rem;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  transition: background-position 0.4s, box-shadow 0.3s, transform 0.2s;
  text-decoration: none !important;
}
.alch-btn:hover {
  background-position: right center;
  box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
  transform: translateY(-2px);
  color: #0D0D0D !important;
}

/* ── Gold Divider ── */
.alch-divider {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
  margin: 2.5rem 0;
}

/* ── Section wrapper utility ── */
.alch-section {
  padding: 4rem 1.5rem;
  max-width: 1100px;
  margin: 0 auto;
}

/* ── Glow text utility ── */
.text-gold-glow {
  color: var(--gold);
  text-shadow: 0 0 20px rgba(212,175,55,0.4);
}

/* ── Overrides for System.io default button styles ── */
.sib-btn, .cf-btn,
[class*="sib-btn"],
[class*="cf-submit"] {
  background: linear-gradient(135deg, #D4AF37, #8B6914, #D4AF37) !important;
  background-size: 200% auto !important;
  color: #0D0D0D !important;
  font-family: 'Inter', sans-serif !important;
  font-weight: 700 !important;
  letter-spacing: 0.1em !important;
  border: none !important;
  border-radius: 4px !important;
  transition: background-position 0.4s, box-shadow 0.3s !important;
}

/* ── Form input overrides ── */
input[type="text"], input[type="email"], input[type="tel"],
textarea, select {
  background: rgba(255,255,255,0.05) !important;
  border: 1px solid rgba(212,175,55,0.3) !important;
  border-radius: 6px !important;
  color: var(--text-main) !important;
  font-family: 'Inter', sans-serif !important;
  padding: 0.75rem 1rem !important;
  transition: border-color 0.25s !important;
}
input[type="text"]:focus, input[type="email"]:focus,
input[type="tel"]:focus, textarea:focus {
  border-color: rgba(212,175,55,0.7) !important;
  outline: none !important;
  box-shadow: 0 0 0 3px rgba(212,175,55,0.1) !important;
}
::placeholder { color: var(--text-muted) !important; opacity: 0.7 !important; }

</style>

<!-- ================================================================
  BRAND QUOTE BLOCK
  Paste this wherever you want the core quote to appear.
  Carries its own styles so it works without a wrapper.
  ================================================================ -->
<style>
.alch-quote-block {
  max-width: 780px;
  margin: 3.5rem auto;
  padding: 2.5rem 2.75rem 2.5rem 3.75rem;
  background: linear-gradient(135deg, rgba(26,26,46,0.97) 0%, rgba(22,33,62,0.97) 100%);
  border-left: 3px solid var(--gold, #D4AF37);
  border-right: 1px solid rgba(212,175,55,0.18);
  border-top: 1px solid rgba(212,175,55,0.12);
  border-bottom: 1px solid rgba(212,175,55,0.12);
  border-radius: 0 10px 10px 0;
  position: relative;
  animation: goldPulse 5s ease-in-out infinite;
}
.alch-quote-block::before {
  content: '\201C';
  font-family: 'Spectral', Georgia, serif;
  font-size: 7rem;
  line-height: 0.8;
  color: rgba(212,175,55,0.15);
  position: absolute;
  top: 1.2rem;
  left: 0.9rem;
  pointer-events: none;
  user-select: none;
}
.alch-quote-block p.quote-text {
  font-family: 'Spectral', Georgia, serif !important;
  font-style: italic;
  font-size: 1.08rem;
  line-height: 2.05;
  color: #E8E4D8;
  margin: 0 0 1.35rem;
}
.alch-quote-block p.quote-attr {
  font-family: 'Inter', sans-serif !important;
  font-style: normal;
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold, #D4AF37);
  margin: 0;
}
</style>

<div class="alch-quote-block">
  <p class="quote-text">
    Drink from the well, my Son, for it is refreshing.
    Drink from the well, my Daughter, for it is a blessing.
    Everything you are looking for is within you.
  </p>
  <p class="quote-attr">— An Alchemist</p>
</div>
