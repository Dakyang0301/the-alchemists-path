<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Your Alchemist's Path dashboard - track your progress, access your courses and continue your transformation journey.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — The Alchemist's Path</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:ital,wght@0,300;0,400;0,700;1,300&family=Great+Vibes&display=swap');
:root{--gold:#C8960A;--gold2:#A07800;--text:#0D1B35;--muted:#4A6282;--bg:rgba(255,255,255,0.55);--bg2:rgba(200,220,255,0.52);--bg3:rgba(160,194,255,0.42);--border:rgba(200,150,10,.3);--font-head:'Cinzel',serif;--font-body:'Lato',sans-serif;--font-quote:'Great Vibes',cursive;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);overflow-x:hidden;}
a{color:var(--gold);text-decoration:none;}
.tap-root{position:relative;z-index:0;}

/* NAV */
.nav{position:fixed;top:0;width:100vw;z-index:99999;display:flex;align-items:center;justify-content:space-between;height:90px;padding:0 40px;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(200,150,10,.18);backdrop-filter:blur(12px);}
.nav::before{content:"";position:absolute;top:-300px;left:0;right:0;height:300px;background:#fff;}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
.nav-logo-symbol{height:40px;width:auto;border-radius:4px;}
.nav-logo-text{font-family:var(--font-head);font-size:.82rem;font-weight:700;color:#b8972a;letter-spacing:.08em;line-height:1.2;}
.nav-logo-sub{font-family:var(--font-body);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:#2c2c3e;opacity:.7;}
.nav-links{display:flex;align-items:center;gap:1.5rem;}
.nav-links a{font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#2c2c3e;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:#b8972a;}
.nav-login{font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#2c2c3e!important;border:1.5px solid rgba(44,44,62,.35);border-radius:3px;padding:6px 14px;transition:border-color .2s,color .2s;}
.nav-login:hover{border-color:#b8972a;color:#b8972a!important;}
.nav-cta{background:#b8972a;color:#fff!important;font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px 28px;border-radius:3px;transition:box-shadow .3s,transform .2s;}
.nav-cta:hover{box-shadow:0 0 20px rgba(184,151,42,.4);transform:translateY(-1px);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.hamburger span{display:block;width:24px;height:2px;background:#b8972a;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:90px;left:0;right:0;background:rgba(255,255,255,.98);border-bottom:2px solid #b8972a;padding:1.5rem 2rem;flex-direction:column;gap:1.25rem;z-index:99998;}
.mobile-menu a{font-family:var(--font-body);font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:#2c2c3e;padding:.5rem 0;border-bottom:1px solid rgba(184,151,42,.15);}
.mobile-menu.open{display:flex;}

/* PAGE */
.page-wrap{padding-top:90px;min-height:100vh;}

/* DASHBOARD HEADER */
.dash-header{padding:3rem 2rem 2rem;max-width:1100px;margin:0 auto;}
.dash-greeting{font-family:var(--font-quote);font-size:clamp(1.8rem,4vw,2.8rem);color:var(--gold2);margin-bottom:.35rem;}
.dash-sub{font-family:var(--font-body);font-size:.85rem;color:var(--muted);letter-spacing:.06em;}
.gold-line{width:56px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1.25rem 0;}

/* DASHBOARD GRID */
.dash-grid{max-width:1100px;margin:0 auto;padding:0 2rem 4rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem;}
.dash-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.75rem;position:relative;overflow:hidden;}
.dash-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(200,150,10,.5),transparent);}
.dash-card--wide{grid-column:span 2;}
.dash-card--full{grid-column:span 3;}
.dash-card-label{font-family:var(--font-head);font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);opacity:.7;margin-bottom:.75rem;}
.dash-card-title{font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:.5rem;}

/* LEVEL CARD */
.level-badge{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem;}
.level-circle{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(200,150,10,.1),rgba(200,150,10,.05));}
.level-circle-name{font-family:var(--font-head);font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--gold);}
.level-info-name{font-family:var(--font-head);font-size:1.6rem;font-weight:900;color:var(--gold);}
.level-info-sub{font-size:.82rem;color:var(--muted);margin-top:.2rem;}
.level-next{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);}
.level-next strong{color:var(--text);}
.level-next-arrow{color:var(--gold);}

/* PROGRESS */
.progress-section{margin-top:1rem;}
.progress-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.progress-label{font-size:.78rem;color:var(--muted);}
.progress-pct{font-family:var(--font-head);font-size:.72rem;color:var(--gold);}
.progress-track{height:8px;background:rgba(200,150,10,.12);border-radius:4px;overflow:hidden;margin-bottom:1rem;}
.progress-fill{height:100%;background:linear-gradient(90deg,#C8960A,#FFD700);border-radius:4px;transition:width .6s ease;}
.module-dots{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;}
.mdot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(200,150,10,.3);}
.mdot--done{background:var(--gold);border-color:var(--gold);}
.mdot--active{background:rgba(200,150,10,.3);border-color:var(--gold);animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,150,10,.4);}50%{box-shadow:0 0 0 4px rgba(200,150,10,.1);}}

/* MODULES */
.modules-list{display:flex;flex-direction:column;gap:.6rem;margin-top:.5rem;}
.mod-item{display:flex;align-items:center;gap:.85rem;padding:.75rem 1rem;border-radius:6px;background:rgba(255,255,255,.5);border:1px solid rgba(200,150,10,.15);cursor:pointer;transition:all .2s;}
.mod-item:hover:not(.mod-locked){border-color:rgba(200,150,10,.4);background:rgba(200,150,10,.05);}
.mod-item.mod-locked{opacity:.5;cursor:not-allowed;}
.mod-num{font-family:var(--font-head);font-size:.6rem;letter-spacing:.15em;color:var(--gold);opacity:.6;min-width:24px;}
.mod-name{font-family:var(--font-body);font-size:.85rem;color:var(--text);flex:1;}
.mod-status{font-family:var(--font-head);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;}
.mod-status--done{color:#2e7d32;}
.mod-status--active{color:var(--gold);}
.mod-status--locked{color:var(--muted);}
.mod-icons{display:flex;gap:.35rem;align-items:center;}
.mod-icon{font-size:.7rem;opacity:.5;}

/* CERTIFICATES */
.cert-list{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem;}
.cert-item{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem;background:rgba(255,255,255,.5);border:1px solid rgba(200,150,10,.2);border-radius:6px;}
.cert-name{font-family:var(--font-head);font-size:.78rem;color:var(--text);}
.cert-date{font-size:.72rem;color:var(--muted);}
.cert-btn{font-family:var(--font-head);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,150,10,.4);border-radius:3px;padding:5px 12px;cursor:pointer;background:none;transition:all .2s;}
.cert-btn:hover{background:rgba(200,150,10,.08);}
.cert-empty{font-size:.85rem;color:var(--muted);font-style:italic;padding:.5rem 0;}

/* COMMUNITY */
.comm-items{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem;}
.comm-item{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1rem;background:rgba(255,255,255,.5);border:1px solid rgba(200,150,10,.15);border-radius:6px;}
.comm-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.comm-text{font-size:.85rem;color:var(--text);line-height:1.6;}
.comm-text strong{color:var(--gold);}
.comm-link{font-family:var(--font-head);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:.3rem;display:block;}

/* ACCOUNT */
.account-rows{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem;}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid rgba(200,150,10,.1);}
.acc-row:last-child{border-bottom:none;}
.acc-key{font-size:.8rem;color:var(--muted);}
.acc-val{font-family:var(--font-head);font-size:.78rem;color:var(--text);}
.acc-val--active{color:#2e7d32;}
.acc-link{font-family:var(--font-head);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,150,10,.3);border-radius:3px;padding:4px 10px;}

/* FOOTER */
.footer{background:var(--bg3);border-top:1px solid var(--border);padding:2rem 1.5rem;}
.footer-bottom{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-copy{font-size:.72rem;color:var(--muted);}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:900px){.dash-grid{grid-template-columns:1fr 1fr;}.dash-card--full{grid-column:span 2;}}
@media(max-width:600px){.dash-grid{grid-template-columns:1fr;}.dash-card--wide,.dash-card--full{grid-column:span 1;}.nav{padding:.9rem 1.25rem;}.nav-links{display:none;}.hamburger{display:flex;}}
</style>
<style>
/* The Alchemist's Path — Signature Background (premium)
   Universal page background. <link rel="stylesheet" href="assets/starlight-background.css"> */

html, body { margin: 0; height: 100%; }

  /* ---- Background ---- */
  .alchemist-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    /* luminous center → soft periwinkle edges for depth (premium vignette) */
    background:
      radial-gradient(130% 95% at 50% 28%,
        #ffffff 0%, #f6f9ff 34%, #eaf1ff 64%, #dde8ff 86%, #d2e0ff 100%);
  }
  /* primary moonlight + sky blooms */
  .alchemist-bg__glow {
    position: absolute;
    inset: -14%;
    background:
      radial-gradient(42vw 42vw at 15% 8%,  rgba(150,188,255,0.62) 0%, rgba(150,188,255,0) 60%),
      radial-gradient(50vw 50vw at 88% 18%, rgba(190,214,255,0.55) 0%, rgba(190,214,255,0) 62%),
      radial-gradient(46vw 44vw at 8% 94%,  rgba(116,158,245,0.34) 0%, rgba(116,158,245,0) 60%);
    will-change: transform, opacity;
    animation: alchemist-breathe 26s cubic-bezier(.4,0,.2,1) infinite alternate;
  }
  .alchemist-bg__glow--gold { display: none; }
  /* still-water reflection band near the bottom */
  .alchemist-bg__water {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 44%;
    background: linear-gradient(180deg, rgba(214,229,255,0) 0%, rgba(202,222,255,0.40) 50%, rgba(178,206,255,0.62) 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 40%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 40%);
  }
  /* polished top sheen */
  .alchemist-bg__sheen {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 32%;
    background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
  }
  /* soft framing vignette in pale blue (keeps focus on content) */
  .alchemist-bg__vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 120% at 50% 42%, rgba(210,224,255,0) 58%, rgba(186,209,255,0.5) 100%);
  }
  .alchemist-bg__stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  @keyframes alchemist-breathe {
    from { transform: translate3d(-1.5%,-1%,0) scale(1);    opacity: .92; }
    to   { transform: translate3d(2%,1.5%,0)   scale(1.07); opacity: 1; }
  }
  @keyframes alchemist-breathe-2 {
    from { transform: translate3d(1.5%,1%,0) scale(1.04); opacity: .55; }
    to   { transform: translate3d(-2%,-1.5%,0) scale(1);  opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .alchemist-bg__glow, .alchemist-bg__glow--gold { animation: none; }
  }

</style>
</head>

<script>
/* The Alchemist's Path — Signature Background (premium twinkle field)
   Depth-layered, parallax starlight with soft bokeh light and rare
   diffraction-spike sparkles, in pale blue / white / faint gold.
   Auto-mounts a fixed `.alchemist-bg` layer (or attaches to one you place).
   Tune via data-density / data-speed. DPR-aware, pauses when hidden,
   honors prefers-reduced-motion. */
(function () {
  'use strict';
  var STAR = [[150,188,255],[190,214,255],[120,158,245],[240,245,255],[236,211,145],[200,150,10]];
  var BOKEH = [[170,200,255],[200,220,255],[236,214,150]];
  function rnd(a,b){ return a + Math.random()*(b-a); }

  function Field(canvas, host) {
    this.canvas = canvas; this.host = host; this.ctx = canvas.getContext('2d');
    this.density = parseFloat(host.getAttribute('data-density') || 1);
    this.speed = parseFloat(host.getAttribute('data-speed') || 1);
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.stars = []; this.bokeh = []; this.t = 0; this.last = 0; this.raf = null; this.running = false;
    this.resize = this.resize.bind(this); this.tick = this.tick.bind(this);
    this.resize();
    addEventListener('resize', this.resize, { passive: true });
    document.addEventListener('visibilitychange', function(){ document.hidden ? this.stop() : this.start(); }.bind(this));
    this.reduced ? this.draw(true) : this.start();
  }
  Field.prototype.build = function () {
    var w=this.w, h=this.h, area=w*h, i;
    var n = Math.max(60, Math.min(260, Math.round(area/7600 * this.density)));
    this.stars = [];
    for (i=0;i<n;i++){
      var roll = Math.random();
      var idx = roll<.28?0 : roll<.48?1 : roll<.62?2 : roll<.84?3 : roll<.965?4 : 5;
      var z = Math.random();
      var r = rnd(.5,.9) + z*(idx>=4?1.5:1.8);
      this.stars.push({
        x: Math.random()*w, y: Math.random()*h, z: z, r: r,
        baseA: rnd(.30,.55) + z*0.4,
        tw: rnd(.4,1.7), phase: rnd(0,Math.PI*2),
        vx: rnd(-.025,.025)*this.speed*(0.4+z),
        vy: rnd(-.025,.025)*this.speed*(0.4+z),
        c: STAR[idx], halo: r > 0.95,
        spike: r > 1.05 || idx>=4
      });
    }
    var bn = Math.max(5, Math.min(14, Math.round(area/150000 * this.density)));
    this.bokeh = [];
    for (i=0;i<bn;i++){
      var bz = Math.random();
      this.bokeh.push({
        x: Math.random()*w, y: Math.random()*h,
        r: rnd(46,120) * (0.6+bz), a: rnd(0.05,0.12),
        tw: rnd(0.15,0.5), phase: rnd(0,Math.PI*2),
        vx: rnd(-.02,.02)*this.speed, vy: rnd(-.02,.02)*this.speed,
        c: BOKEH[(Math.random()<0.18)?2:(Math.random()<0.5?0:1)]
      });
    }
  };
  Field.prototype.resize = function () {
    this.w = this.host.clientWidth || innerWidth;
    this.h = this.host.clientHeight || innerHeight;
    this.canvas.width = Math.floor(this.w*this.dpr);
    this.canvas.height = Math.floor(this.h*this.dpr);
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.build();
    if (this.reduced) this.draw(true);
  };
  Field.prototype.disc = function (b, a) {
    var ctx=this.ctx, col=b.c[0]+','+b.c[1]+','+b.c[2];
    var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,'rgba('+col+','+a+')'); g.addColorStop(.6,'rgba('+col+','+(a*.4)+')'); g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  };
  Field.prototype.spike = function (s, a) {
    var ctx=this.ctx, col=s.c[0]+','+s.c[1]+','+s.c[2], len=s.r*8;
    var g=ctx.createLinearGradient(s.x-len,s.y,s.x+len,s.y);
    g.addColorStop(0,'rgba('+col+',0)'); g.addColorStop(.5,'rgba('+col+','+(a*.65)+')'); g.addColorStop(1,'rgba('+col+',0)');
    ctx.strokeStyle=g; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.moveTo(s.x-len,s.y); ctx.lineTo(s.x+len,s.y); ctx.stroke();
    var g2=ctx.createLinearGradient(s.x,s.y-len,s.x,s.y+len);
    g2.addColorStop(0,'rgba('+col+',0)'); g2.addColorStop(.5,'rgba('+col+','+(a*.65)+')'); g2.addColorStop(1,'rgba('+col+',0)');
    ctx.strokeStyle=g2;
    ctx.beginPath(); ctx.moveTo(s.x,s.y-len); ctx.lineTo(s.x,s.y+len); ctx.stroke();
  };
  Field.prototype.star = function (s, a) {
    var ctx=this.ctx, col=s.c[0]+','+s.c[1]+','+s.c[2];
    if (s.halo) {
      var rg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);
      rg.addColorStop(0,'rgba('+col+','+(a*.55)+')'); rg.addColorStop(1,'rgba('+col+',0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*6,0,7); ctx.fill();
    }
    if (s.spike && a>0.22) this.spike(s,a);
    ctx.fillStyle='rgba('+col+','+a+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  };
  Field.prototype.draw = function (stat) {
    var ctx=this.ctx, i, s, b; ctx.clearRect(0,0,this.w,this.h);
    for (i=0;i<this.bokeh.length;i++){ b=this.bokeh[i]; this.disc(b, stat ? b.a : b.a*(.7+.3*Math.sin(this.t*b.tw+b.phase))); }
    for (i=0;i<this.stars.length;i++){ s=this.stars[i]; this.star(s, stat ? s.baseA : Math.max(0, s.baseA*(.5+.5*Math.sin(this.t*s.tw+s.phase)))); }
  };
  Field.prototype.tick = function (now) {
    if (!this.running) return;
    var dt = this.last ? (now-this.last)/1000 : .016; this.last=now; this.t+=dt;
    var i, s, b;
    for (i=0;i<this.bokeh.length;i++){ b=this.bokeh[i]; b.x+=b.vx; b.y+=b.vy;
      if (b.y<-b.r) b.y=this.h+b.r; if (b.y>this.h+b.r) b.y=-b.r; if (b.x<-b.r) b.x=this.w+b.r; if (b.x>this.w+b.r) b.x=-b.r; }
    for (i=0;i<this.stars.length;i++){ s=this.stars[i]; s.x+=s.vx; s.y+=s.vy;
      if (s.y<-10) s.y=this.h+10; if (s.y>this.h+10) s.y=-10; if (s.x<-10) s.x=this.w+10; if (s.x>this.w+10) s.x=-10; }
    this.draw(false);
    this.raf=requestAnimationFrame(this.tick);
  };
  Field.prototype.start = function (){ if(this.running||this.reduced) return; this.running=true; this.last=0; this.raf=requestAnimationFrame(this.tick); };
  Field.prototype.stop = function (){ this.running=false; if(this.raf) cancelAnimationFrame(this.raf); };

  function build(host) {
    host.classList.add('alchemist-bg');
    if (host.querySelector('.alchemist-bg__stars')) return;
    ['alchemist-bg__glow','alchemist-bg__glow alchemist-bg__glow--gold','alchemist-bg__sheen'].forEach(function(c){
      var d=document.createElement('div'); d.className=c; host.appendChild(d);
    });
    var canvas=document.createElement('canvas'); canvas.className='alchemist-bg__stars'; host.appendChild(canvas);
    ['alchemist-bg__water','alchemist-bg__vignette'].forEach(function(c){
      var d=document.createElement('div'); d.className=c; host.appendChild(d);
    });
    return new Field(canvas, host);
  }
  window.AlchemistBackground = { mount: function(el){ var h=typeof el==='string'?document.querySelector(el):el; return h?build(h):null; } };

  function auto(){ var el=document.querySelector('.alchemist-bg'); if(!el){ el=document.createElement('div'); document.body.appendChild(el); } build(el); }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', auto);
  else auto();
})();

</script>

(function(){

  var LEVEL_NUM  = {Lead:1,Iron:2,Steel:3,Copper:4,Silver:5,Gold:6};

  var progress   = user.progress || {};
  var lvlProg    = progress[level] || {completed:[]};
  var completed  = lvlProg.completed || [];
  var numDone    = completed.length;
  var pct        = Math.round((numDone / 12) * 100);
  var first      = user.name ? user.name.split(' ')[0] : 'there';

  // Greeting
  document.getElementById('dashGreeting').textContent = 'Welcome back, ' + first + '.';

  // ── LEVEL CARD ──
  document.getElementById('cardLevel').innerHTML =
    '<p class="dash-card-label">Your Level</p>' +
    '<div class="level-badge">' +
      '<div class="level-circle"><span class="level-circle-name">' + level.toUpperCase() + '</span></div>' +
      '<div><div class="level-info-name">' + level + '</div>' +
      '<div class="level-info-sub">Level ' + (LEVEL_NUM[level]||'?') + ' of 6</div></div>' +
    '</div>' +
    '<div class="level-next"><span>Next level:</span><span class="level-next-arrow">→</span><strong>' + (NEXT_LEVEL[level]||'—') + '</strong></div>';

  // ── PROGRESS CARD ──
  var dots = '';
  for(var i=1;i<=12;i++){
    var mod_label = i===1?'Entry Assessment':i===12?'Exit Assessment':'Module '+i;
    var cls = completed.indexOf(i)>=0 ? 'mdot mdot--done' : (i===numDone+1 ? 'mdot mdot--active' : 'mdot');
    dots += '<div class="' + cls + '" title="' + mod_label + '"></div>';
  }
  document.getElementById('cardProgress').innerHTML =
    '<p class="dash-card-label">Level Progress — ' + level + '</p>' +
    '<div class="progress-section">' +
      '<div class="progress-label-row">' +
        '<span class="progress-label">Modules completed</span>' +
        '<span class="progress-pct">' + numDone + ' / 12</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="module-dots">' + dots + '</div>' +
    '</div>';

  // ── MODULES CARD ──
  var modRows = '';
  for(var m=1;m<=12;m++){
    var mName  = m===1 ? 'Entry Assessment' : m===12 ? 'Exit Assessment' : 'Module ' + m;
    var isDone = completed.indexOf(m) >= 0;
    var isNext = !isDone && m === numDone + 1;
    var isLock = !isDone && !isNext;
    var cls2   = 'mod-item' + (isLock ? ' mod-locked' : '');
    var status = isDone ? '<span class="mod-status mod-status--done">Completed</span>'
                       : isNext ? '<span class="mod-status mod-status--active">In Progress</span>'
                       : '<span class="mod-status mod-status--locked">Locked</span>';
    var action = isNext ? ' onclick="markDone('+m+')"' : '';
    modRows += '<div class="' + cls2 + '"' + action + ' style="' + (isNext?'cursor:pointer;':'')+'">' +
      '<span class="mod-num">' + String(m).padStart(2,'0') + '</span>' +
      '<span class="mod-name">' + mName + '</span>' +
      '<div class="mod-icons"></div>' + status + '</div>';
  }
  document.getElementById('cardModules').innerHTML =
    '<p class="dash-card-label">' + level + ' — Course Modules</p>' +
    '<div class="modules-list">' + modRows + '</div>';

  // ── CERTIFICATES CARD ──
  var certs = user.certificates || [];
  var certHTML = certs.length === 0
    ? '<p class="cert-empty">No certificates earned yet. Complete all 12 modules of a level to earn yours.</p>'
    : certs.map(function(c){
        return '<div class="cert-item"><div><div class="cert-name">'+c.level+' Level — Completed</div>' +
               '<div class="cert-date">Issued: '+c.date+'</div></div>' +
               '<button class="cert-btn">View / Print</button></div>';
      }).join('');
  document.getElementById('cardCerts').innerHTML =
    '<p class="dash-card-label">Certificates Earned</p><div class="cert-list">' + certHTML + '</div>';

  // ── ACCOUNT CARD ──
  var mem = user.membership || 'free';
  document.getElementById('cardAccount').innerHTML =
    '<p class="dash-card-label">Account &amp; Membership</p>' +
    '<div class="account-rows">' +
      '<div class="acc-row"><span class="acc-key">Name</span><span class="acc-val">' + user.name + '</span></div>' +
      '<div class="acc-row"><span class="acc-key">Email</span><span class="acc-val">' + user.email + '</span></div>' +
      '<div class="acc-row"><span class="acc-key">Plan</span><span class="acc-val acc-val--active">' + (PLAN_LABEL[mem]||mem) + '</span></div>' +
      '<div class="acc-row"><span class="acc-key">Account</span><a href="register.html" class="acc-link">Edit</a></div>' +
    '</div>';

  // ── COMMUNITY CARD ──
  var groupHTML = mem === 'group'
    ? '<div class="comm-item"><div class="comm-text"><strong>12 for 12 Group Meeting</strong><br>Your biweekly meeting link:<a href="#" class="comm-link">Join Meeting &rarr;</a></div></div>'
    : '<div class="comm-item"><div class="comm-text"><strong>12 for 12 Group</strong><br>You are not in a group yet.<a href="quiz.html" class="comm-link">Join a 12 for 12 Group &rarr;</a></div></div>';
  document.getElementById('cardCommunity').innerHTML =
    '<p class="dash-card-label">Community &amp; Group</p>' +
    '<div class="comm-items">' +
      '<div class="comm-item"><div class="comm-text"><strong>Community Messages</strong><br>Connect with other members on The Alchemist\'s Path.<a href="#" class="comm-link">Go to Community &rarr;</a></div></div>' +
      groupHTML +
    '</div>';

  // ── LOGOUT ──
  document.getElementById('logoutBtn').addEventListener('click',function(){
    localStorage.removeItem('tap_user');
    window.location.href = 'login.html';
  });

  // ── MARK MODULE DONE ──
  window.markDone = function(modNum){
    if(completed.indexOf(modNum) >= 0) return;
    completed.push(modNum);
    if(!user.progress) user.progress = {};
    if(!user.progress[level]) user.progress[level] = {completed:[]};
    user.progress[level].completed = completed;

    // If all 12 done, award certificate
    if(completed.length === 12){
      if(!user.certificates) user.certificates = [];
      var already = user.certificates.find(function(c){return c.level===level;});
      if(!already){
        var today = new Date().toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'});
        user.certificates.push({level:level, date:today});
      }
    }

    // Save updated user
    localStorage.setItem('tap_user', JSON.stringify(user));
    var users = JSON.parse(localStorage.getItem('tap_users')||'[]');
    var idx = users.findIndex(function(u){return u.email===user.email;});
    if(idx>=0){ users[idx]=user; localStorage.setItem('tap_users',JSON.stringify(users)); }

    location.reload();
  };
})();
</script>
<script>
(function(){
var CSS=`
#tap-chat-btn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9000;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#C8960A,#a07800);box-shadow:0 4px 20px rgba(200,150,10,.5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
#tap-chat-btn:hover{transform:scale(1.08);}
#tap-chat-btn svg{width:26px;height:26px;fill:#fff;}
#tap-chat-win{position:fixed;bottom:5rem;right:1.5rem;z-index:9001;width:340px;max-width:calc(100vw - 2rem);background:#0d1f3c;border:1px solid rgba(200,150,10,.3);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden;font-family:'Lato',sans-serif;}
#tap-chat-win.open{display:flex;}
#tap-chat-header{background:linear-gradient(135deg,#0d1f3c,#1a3a6b);padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid rgba(200,150,10,.2);}
#tap-chat-header .ch-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C8960A,#a07800);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0;}
#tap-chat-header .ch-info{flex:1;}
#tap-chat-header .ch-name{font-size:.85rem;font-weight:700;color:#C8960A;font-family:'Cinzel',serif;}
#tap-chat-header .ch-status{font-size:.68rem;color:rgba(255,255,255,.5);}
#tap-chat-header .ch-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:1.3rem;cursor:pointer;padding:0;line-height:1;}
#tap-chat-header .ch-close:hover{color:#fff;}
#tap-chat-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem;max-height:320px;}
#tap-chat-msgs::-webkit-scrollbar{width:3px;}
#tap-chat-msgs::-webkit-scrollbar-thumb{background:rgba(200,150,10,.3);border-radius:3px;}
.tc-msg{max-width:85%;padding:.65rem .9rem;border-radius:12px;font-size:.8rem;line-height:1.55;}
.tc-msg.bot{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);border-bottom-left-radius:3px;align-self:flex-start;}
.tc-msg.user{background:linear-gradient(135deg,#C8960A,#a07800);color:#fff;border-bottom-right-radius:3px;align-self:flex-end;}
.tc-msg a{color:#C8960A;text-decoration:underline;}
.tc-msg.bot a{color:#f0c040;}
#tap-quick-btns{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 1rem;}
.tc-qbtn{background:rgba(200,150,10,.12);border:1px solid rgba(200,150,10,.3);color:#C8960A;border-radius:20px;padding:.35rem .75rem;font-size:.72rem;cursor:pointer;transition:all .2s;}
.tc-qbtn:hover{background:rgba(200,150,10,.25);}
#tap-chat-input-row{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid rgba(200,150,10,.15);}
#tap-chat-input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(200,150,10,.2);border-radius:20px;padding:.5rem .9rem;color:#fff;font-size:.8rem;outline:none;}
#tap-chat-input::placeholder{color:rgba(255,255,255,.3);}
#tap-chat-send{background:linear-gradient(135deg,#C8960A,#a07800);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#tap-chat-send svg{width:16px;height:16px;fill:#fff;}
`;

var style=document.createElement('style');
style.textContent=CSS;
document.head.appendChild(style);

var html=`
<button id="tap-chat-btn" onclick="tapChatToggle()" aria-label="Open chat">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
</button>
<div id="tap-chat-win">
  <div id="tap-chat-header">
    <div class="ch-avatar">TAP</div>
    <div class="ch-info">
      <div class="ch-name">Alchemist Assistant</div>
      <div class="ch-status">&#9679; Online — here to help</div>
    </div>
    <button class="ch-close" onclick="tapChatToggle()">&times;</button>
  </div>
  <div id="tap-chat-msgs"></div>
  <div id="tap-quick-btns">
    <button class="tc-qbtn" onclick="tapAsk('What is The Alchemist\'s Path?')">What is TAP?</button>
    <button class="tc-qbtn" onclick="tapAsk('How do I find my level?')">Find my level</button>
    <button class="tc-qbtn" onclick="tapAsk('What are the levels?')">The levels</button>
    <button class="tc-qbtn" onclick="tapAsk('How much does it cost?')">Pricing</button>
    <button class="tc-qbtn" onclick="tapAsk('How do I start?')">How to start</button>
    <button class="tc-qbtn" onclick="tapAsk('Talk to a person')">Talk to someone</button>
  </div>
  <div id="tap-chat-input-row">
    <input id="tap-chat-input" type="text" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')tapSend()">
    <button id="tap-chat-send" onclick="tapSend()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
`;

var wrap=document.createElement('div');
wrap.innerHTML=html;
document.body.appendChild(wrap);

var opened=false;
var greeted=false;

window.tapChatToggle=function(){
  opened=!opened;
  var win=document.getElementById('tap-chat-win');
  win.classList.toggle('open',opened);
  if(opened&&!greeted){
    greeted=true;
    setTimeout(function(){tapBot("Welcome to The Alchemist's Path! I'm your guide here. Ask me anything about the programme, levels, glossary, or pricing — or choose a quick topic below.");},300);
  }
};

window.tapAsk=function(q){
  tapUserMsg(q);
  tapRespond(q);
};

window.tapSend=function(){
  var input=document.getElementById('tap-chat-input');
  var q=input.value.trim();
  if(!q)return;
  input.value='';
  tapUserMsg(q);
  tapRespond(q);
};

function tapUserMsg(text){
  var msgs=document.getElementById('tap-chat-msgs');
  var d=document.createElement('div');
  d.className='tc-msg user';
  d.textContent=text;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function tapBot(text){
  var msgs=document.getElementById('tap-chat-msgs');
  var d=document.createElement('div');
  d.className='tc-msg bot';
  d.innerHTML=text;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function tapRespond(q){
  var ql=q.toLowerCase();
  setTimeout(function(){
    if(/thank|thanks|thank you|salamat|cheers|appreciate/i.test(ql)){
      tapBot("You're welcome! Feel free to ask anything else. 😊");
    } else if(/\bhello\b|\bhi\b|\bhey\b|good morning|good afternoon|good evening/i.test(ql)){
      tapBot("Hello! How can I help you today?");
    } else if(/what is|what'?s tap|alchemist path|about tap|this website|use of|purpose of/i.test(ql)){
      tapBot("TAP is a transformation system by Andrew Porteous covering <strong>Financial Intelligence, Self-Development & Spiritual Awareness</strong>. Practical steps toward real freedom.");
    } else if(/find my level|my level|quiz|test|which level/i.test(ql)){
      tapBot("Take the free <strong>20-question quiz</strong> to find your level. <a href='/quiz'>Start here &rarr;</a>");
    } else if(/levels|stages|lead|iron|steel|copper|silver|gold|palladium|tin/i.test(ql)){
      tapBot("<strong>7 levels:</strong> Tin, Lead, Iron, Steel, Copper, Silver, Gold + Palladium (Mastery). Each has 12 modules. <a href='/levels'>View levels &rarr;</a>");
    } else if(/cost|price|how much|payment|fee|euro|subscription|member/i.test(ql)){
      tapBot("<strong>&euro;5.55/month</strong> — individual membership<br><strong>&euro;9.99/month</strong> — 12 for 12 Group with Andrew");
    } else if(/start|begin|how to|getting started/i.test(ql)){
      tapBot("Start with the free quiz to find your level, then go from there. <a href='/how-to-start'>How to Start &rarr;</a>");
    } else if(/glossary|terms|definitions|words/i.test(ql)){
      tapBot("Over <strong>2,776 terms</strong> — Financial, Self-Development & Spiritual. Free, no login needed. <a href='/glossary'>Open Glossary &rarr;</a>");
    } else if(/group|12 for 12|community|biweekly|meeting/i.test(ql)){
      tapBot("<strong>12 for 12 Group</strong> — 12-month programme with Andrew. Biweekly meetings + community. <a href='/group'>Learn more &rarr;</a>");
    } else if(/andrew|who is|trainer|coach/i.test(ql)){
      tapBot("Andrew Porteous — trainer, coach, 35+ years experience. Financially free at 40. Based in Germany. <a href='/about'>His story &rarr;</a>");
    } else if(/modules|courses|lessons|curriculum/i.test(ql)){
      tapBot("<strong>12 modules per level.</strong> Module 1 = free assessment. Modules 2–11 = learning. Module 12 = final assessment. Lead level available now.");
    } else if(/certificate|cert|completion/i.test(ql)){
      tapBot("Yes! Printable certificates are issued when you complete each level.");
    } else if(/contact|email|help|support|person|vanesa|human|real/i.test(ql)||/talk to/i.test(ql)){
      tapBot("Contact <strong>Vanesa</strong> for personal support. <a href='/about#contact'>Contact form &rarr;</a>");
    } else if(/login|log in|sign in|account|register/i.test(ql)){
      tapBot("<a href='/login'>Log in &rarr;</a> or <a href='/register'>Create account &rarr;</a>");
    } else {
      tapBot("This website is <strong>The Alchemist's Path</strong> — a step-by-step transformation system by Andrew Porteous covering Financial Intelligence, Self-Development, and Spiritual Awareness. You start with a free quiz to find your level, then progress through courses, eBooks, and community support.<br><br>Not sure where to begin? <a href='/quiz'>Take the free quiz &rarr;</a>");
    }
  },600);
}

})();

</script>
</body>
</html>
